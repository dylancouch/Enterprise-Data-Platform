name: local-spark-delta-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p .cache/ivy .cache/spark-tmp
      - run: ruff check *.py tests scripts
      - run: python -m compileall -q cli.py project_info.py spark_delta.py construction_generator.py construction_pipeline.py saas_pipeline.py databricks_entry.py tests scripts
      - run: pytest
      - run: python -m cli saas-demo --root data/saas-ci
