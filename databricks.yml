bundle:
  name: enterprise-data-platform

variables:
  catalog:
    description: Existing Unity Catalog catalog for isolated development objects
    default: main
  schema:
    description: Project-owned schema in the selected catalog
    default: enterprise_data_dev
  demo_scenario:
    description: Synthetic source scenario to generate for this bounded demo run
    default: golden

workspace:
  # Configure this profile with `databricks auth login --host <workspace-url> --profile enterprise-data-dev`.
  profile: enterprise-data-dev
resources:
  schemas:
    enterprise_data_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Enterprise Data Platform synthetic domain examples
  volumes:
    enterprise_data_volume:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: enterprise_data
      volume_type: MANAGED
      comment: Synthetic-only input files and bounded local demo artifacts
  jobs:
    construction_demo:
      name: enterprise-data-platform-construction-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: synthetic_demo
          max_retries: 1
          spark_python_task:
            python_file: ./src/enterprise_data_platform/databricks_entry.py
            parameters:
              - --root
              - /Volumes/${var.catalog}/${var.schema}/enterprise_data
              - --scenario
              - ${var.demo_scenario}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies: []

targets:
  dev:
    default: true
    mode: development
    variables:
      schema: enterprise_data_dev
      demo_scenario: golden
  prod:
    mode: production
    variables:
      schema: enterprise_data_prod
      demo_scenario: golden
